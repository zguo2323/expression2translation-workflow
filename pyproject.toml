[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "expression2translation-workflow"
version = "0.1.0"
description = "Reproducible RNA-seq and Ribo-seq workflow with a laboratory project registry"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "E2T contributors"}]

[project.scripts]
e2t = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src", "src.*"]
