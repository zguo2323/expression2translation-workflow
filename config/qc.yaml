# Raw QC may run as soon as one library has complete FASTQ files.
mode: trim                # raw | trim
sample_ids: []            # empty = all active libraries; set a subset for incremental QC
synthetic: false
policies:
  rnaseq:
    confirmed: true
    evidence: "GSE203147 RNA dispersed-sample fastp/Salmon pilot: explicit TruSeq adapters affected 0.44-0.70% of mates; Q20, <=40% low-quality bases and 31-nt minimum retained >=99.72% of pairs; no fixed-front trim supported"
    adapter_mode: sequence # sequence | none (none means confirmed absent/already removed)
    adapter_r1: AGATCGGAAGAGCACACGTCTGAACTCCAGTCA
    adapter_r2: AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT
    barcode_mode: none    # none | fixed_front; unsupported barcode sorting blocks trim
    trim_front1: 0
    trim_front2: 0
    min_length: 31
    quality_phred: 20
    unqualified_percent: 40
  riboseq:
    confirmed: true
    evidence: "GSE203147 archived reads are variable-length and FastQC adapter PASS; dispersed diagnostic found 76.98-79.17% exact end-to-end unique coding matches and no evidence for uniform fixed-front trimming; preserve the paper's 17-34 nt range before explicit downstream length selection"
    adapter_mode: none
    adapter_r1: null
    adapter_r2: null
    barcode_mode: none
    trim_front1: 0
    trim_front2: 0
    min_length: 17
    quality_phred: 20
    unqualified_percent: 40
